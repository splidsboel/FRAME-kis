[project]
name = "frame-kis"
version = "0.1.0"
description = "FRAME — a Filtered-ANN benchmark suite for Known-Item Search over V3C"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

# Optional paths keep the heavy toolchains off the light harness install.
#   uv sync                      -> core harness only
#   uv sync --extra pgvector     -> + psycopg2 (run against pgvector)
#   uv sync --extra chroma       -> + chromadb (run against Chroma)
#   uv sync --extra encode       -> + torch/transformers (shared SigLIP encoder)
#   uv sync --extra oracle       -> + everything the HPC GT build needs
#   uv sync --extra viz          -> + matplotlib (plots)
[project.optional-dependencies]
pgvector = ["psycopg2-binary>=2.9"]
# 1.5.0 is the floor: array-valued metadata + the $contains/$not_contains operators
# over arrays (how the denormalised label sets are filtered) landed there.
chroma = ["chromadb>=1.5.0"]
encode = ["torch>=2.1", "transformers>=4.40"]
oracle = ["psycopg2-binary>=2.9", "torch>=2.1", "transformers>=4.40"]
viz = ["matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["frame", "frame.core", "frame.adapters"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Unit suite covers the pure-logic harness core only (no live DB / torch / HPC).
testpaths = ["tests"]
addopts = "-ra -q"
