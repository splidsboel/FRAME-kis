name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Core harness + dev group only (numpy + pytest). No pgvector/encode/oracle
      # extras: the unit suite covers pure logic and needs no live DB, torch, or HPC.
      - name: Sync dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest
